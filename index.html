<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกเวลาเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Sarabun', sans-serif;
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        
        .loading.show {
            display: flex;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 5px;
            color: white;
            font-weight: 500;
            z-index: 10000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }
        
        .message.show {
            transform: translateX(0);
        }
        
        .message.success {
            background-color: #10b981;
        }
        
        .message.error {
            background-color: #ef4444;
        }
        
        .message.info {
            background-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <!-- Loading Overlay -->
    <div id="loading" class="loading">
        <div class="bg-white p-6 rounded-lg shadow-lg text-center">
            <div class="spinner mx-auto mb-4"></div>
            <p id="loadingText" class="text-gray-700">กำลังโหลด...</p>
        </div>
    </div>

    <!-- Message Container -->
    <div id="messageContainer"></div>

    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">📚 ระบบบันทึกเวลาเรียน</h1>
            <p class="text-gray-600">จัดการข้อมูลการเข้าเรียนอย่างมีประสิทธิภาพ</p>
        </div>

        <!-- Navigation -->
        <div class="bg-white rounded-lg shadow-md mb-8">
            <div class="flex flex-wrap justify-center p-4 space-x-2 space-y-2 md:space-y-0">
                <button onclick="showSection('attendance')" class="nav-btn bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg transition-colors">
                    📝 บันทึกการเข้าเรียน
                </button>
                <button onclick="showSection('management')" class="nav-btn bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-lg transition-colors">
                    ⚙️ จัดการข้อมูล
                </button>
                <button onclick="showSection('history')" class="nav-btn bg-purple-500 hover:bg-purple-600 text-white px-6 py-2 rounded-lg transition-colors">
                    📊 ประวัติการเข้าเรียน
                </button>
            </div>
        </div>

        <!-- Content Sections -->
        <div id="content" class="fade-in">
            <!-- Attendance Section -->
            <div id="attendanceSection" class="section">
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">📝 บันทึกการเข้าเรียน</h2>
                    
                    <div class="grid md:grid-cols-3 gap-4 mb-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">วันที่</label>
                            <input type="date" id="attendanceDate" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">ห้องเรียน</label>
                            <select id="attendanceClassroom" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="">เลือกห้องเรียน</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">รายวิชา</label>
                            <select id="attendanceSubject" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="">เลือกรายวิชา</option>
                            </select>
                        </div>
                    </div>

                    <button onclick="loadAttendanceForm()" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg transition-colors mb-6">
                        โหลดรายชื่อนักเรียน
                    </button>

                    <div id="studentList" class="hidden">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">รายชื่อนักเรียน</h3>
                        <div id="studentAttendance" class="space-y-2"></div>
                        <button onclick="saveAttendance()" class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-lg transition-colors mt-6">
                            บันทึกการเข้าเรียน
                        </button>
                    </div>
                </div>
            </div>

            <!-- Management Section -->
            <div id="managementSection" class="section hidden">
                <div class="grid md:grid-cols-2 gap-6">
                    <!-- Classroom Management -->
                    <div class="bg-white rounded-lg shadow-md p-6">
                        <h2 class="text-2xl font-bold text-gray-800 mb-6">🏫 จัดการห้องเรียน</h2>
                        
                        <div class="mb-4">
                            <input type="text" id="classroomName" placeholder="ชื่อห้องเรียน" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent mb-3">
                            <button onclick="addClassroom()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition-colors">
                                เพิ่มห้องเรียน
                            </button>
                        </div>

                        <div id="classroomList" class="space-y-2"></div>
                    </div>

                    <!-- Subject Management -->
                    <div class="bg-white rounded-lg shadow-md p-6">
                        <h2 class="text-2xl font-bold text-gray-800 mb-6">📚 จัดการรายวิชา</h2>
                        
                        <div class="mb-4">
                            <input type="text" id="subjectName" placeholder="ชื่อรายวิชา" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent mb-3">
                            <button onclick="addSubject()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg transition-colors">
                                เพิ่มรายวิชา
                            </button>
                        </div>

                        <div id="subjectList" class="space-y-2"></div>
                    </div>
                </div>
            </div>

            <!-- History Section -->
            <div id="historySection" class="section hidden">
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">📊 ประวัติการเข้าเรียน</h2>
                    
                    <div class="grid md:grid-cols-4 gap-4 mb-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">วันที่</label>
                            <input type="date" id="historyDate" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">ห้องเรียน</label>
                            <select id="historyClassroom" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="">ทุกห้องเรียน</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">รายวิชา</label>
                            <select id="historySubject" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="">ทุกรายวิชา</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button onclick="filterHistory()" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg transition-colors w-full">
                                ค้นหา
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <button onclick="deleteSelectedAttendance()" class="bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-lg transition-colors">
                            🗑️ ลบข้อมูลที่เลือก
                        </button>
                    </div>

                    <div id="historyResults" class="overflow-x-auto"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Student Management Modal -->
    <div id="studentModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-[90vh] overflow-hidden">
            <div class="p-6 border-b border-gray-200">
                <div class="flex justify-between items-center">
                    <h3 id="studentModalTitle" class="text-xl font-bold text-gray-800">จัดการนักเรียน</h3>
                    <button onclick="closeStudentModal()" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="p-6 overflow-y-auto max-h-[calc(90vh-120px)]">
                <!-- Add Student Form -->
                <div class="mb-6 p-4 bg-gray-50 rounded-lg">
                    <h4 class="font-semibold text-gray-800 mb-3">เพิ่มนักเรียนใหม่</h4>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                        <input type="number" id="studentNumber" placeholder="เลขที่" class="p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <input type="text" id="studentId" placeholder="เลขประจำตัวนักเรียน" class="p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <input type="text" id="studentName" placeholder="ชื่อ-สกุล" class="p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <button onclick="addStudent()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded transition-colors">
                            เพิ่ม
                        </button>
                    </div>
                </div>

                <!-- Import from Excel -->
                <div class="mb-6 p-4 bg-blue-50 rounded-lg">
                    <h4 class="font-semibold text-gray-800 mb-3">นำเข้าจาก Excel</h4>
                    <div class="flex flex-wrap gap-3 items-center">
                        <input type="file" id="excelFile" accept=".xlsx,.xls,.csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                        <button onclick="importFromExcel()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded transition-colors">
                            นำเข้าจาก Excel
                        </button>
                        <button onclick="saveImportedStudents()" id="saveImportBtn" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded transition-colors hidden">
                            บันทึกข้อมูล
                        </button>
                        <button onclick="clearImportedData()" id="clearImportBtn" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded transition-colors hidden">
                            ปิด
                        </button>
                    </div>
                    <div id="importPreview" class="mt-4 hidden">
                        <h5 class="font-medium text-gray-700 mb-2">ข้อมูลที่นำเข้า:</h5>
                        <div id="importedData" class="max-h-40 overflow-y-auto border border-gray-200 rounded p-2 bg-white"></div>
                    </div>
                </div>

                <!-- Student List -->
                <div>
                    <h4 class="font-semibold text-gray-800 mb-3">รายชื่อนักเรียน</h4>
                    <div id="studentListModal" class="space-y-2"></div>
                </div>
            </div>
            
            <div class="p-6 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="closeStudentModal()" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded transition-colors">
                    ปิด
                </button>
                <button onclick="saveStudentChanges()" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded transition-colors">
                    บันทึกการเปลี่ยนแปลง
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        // Configuration
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwx_l9dnBVP5daaTfxyP8QYdOkClRBdwvUvN9-o51-uI9OGUNl2t6xf3u3I9xPK9p0/exec';
        
        // Global variables
        let classrooms = [];
        let subjects = [];
        let attendanceRecords = [];
        let currentStudents = [];
        let currentEditingClassroom = null;
        let importedStudents = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Set today's date
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('attendanceDate').value = today;
            document.getElementById('historyDate').value = today;
            
            // Load initial data
            loadAllData();
            
            // Show attendance section by default
            showSection('attendance');
        });

        // Utility functions
        function showLoading(text = 'กำลังโหลด...') {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loading').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('show');
        }

        function showMessage(message, type = 'info') {
            const messageContainer = document.getElementById('messageContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            
            messageContainer.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.classList.add('show');
            }, 100);
            
            setTimeout(() => {
                messageDiv.classList.remove('show');
                setTimeout(() => {
                    messageContainer.removeChild(messageDiv);
                }, 300);
            }, 3000);
        }

        function showSection(sectionName) {
            // Hide all sections
            document.querySelectorAll('.section').forEach(section => {
                section.classList.add('hidden');
            });
            
            // Show selected section
            document.getElementById(sectionName + 'Section').classList.remove('hidden');
            
            // Update navigation buttons
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('ring-2', 'ring-offset-2');
            });
            
            // Render content based on section
            if (sectionName === 'management') {
                renderClassroomManagement();
                renderSubjectManagement();
            } else if (sectionName === 'history') {
                populateHistoryFilters();
            } else if (sectionName === 'attendance') {
                populateAttendanceSelects();
            }
        }

        // Data loading functions
        async function loadAllData() {
            try {
                showLoading('กำลังโหลดข้อมูล...');
                
                const response = await fetch(`${WEB_APP_URL}?action=loadAllData&sheetId=1ski-KWzrzsnWKkdlbJ0sPdwtNWZR5No809eK-Bk91t4`);
                const result = await response.json();
                
                if (result.success) {
                    classrooms = result.data.classrooms || [];
                    subjects = result.data.subjects || [];
                    attendanceRecords = result.data.attendance || [];
                    
                    // เรียงลำดับข้อมูล
                    classrooms.sort((a, b) => a.name.localeCompare(b.name, 'th'));
                    subjects.sort((a, b) => a.name.localeCompare(b.name, 'th'));
                    
                    populateAttendanceSelects();
                    showMessage('โหลดข้อมูลสำเร็จ', 'success');
                } else {
                    showMessage('เกิดข้อผิดพลาดในการโหลดข้อมูล: ' + (result.message || 'ไม่ทราบสาเหตุ'), 'error');
                }
            } catch (error) {
                console.error('Error loading data:', error);
                showMessage('เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        function populateAttendanceSelects() {
            const classroomSelect = document.getElementById('attendanceClassroom');
            const subjectSelect = document.getElementById('attendanceSubject');
            
            // Clear existing options
            classroomSelect.innerHTML = '<option value="">เลือกห้องเรียน</option>';
            subjectSelect.innerHTML = '<option value="">เลือกรายวิชา</option>';
            
            // เรียงลำดับและเพิ่มตัวเลือก
            const sortedClassrooms = [...classrooms].sort((a, b) => a.name.localeCompare(b.name, 'th'));
            const sortedSubjects = [...subjects].sort((a, b) => a.name.localeCompare(b.name, 'th'));
            
            sortedClassrooms.forEach(classroom => {
                const option = document.createElement('option');
                option.value = classroom.id;
                option.textContent = classroom.name;
                classroomSelect.appendChild(option);
            });
            
            sortedSubjects.forEach(subject => {
                const option = document.createElement('option');
                option.value = subject.id;
                option.textContent = subject.name;
                subjectSelect.appendChild(option);
            });
        }

        function populateHistoryFilters() {
            const classroomSelect = document.getElementById('historyClassroom');
            const subjectSelect = document.getElementById('historySubject');
            
            // Clear existing options
            classroomSelect.innerHTML = '<option value="">ทุกห้องเรียน</option>';
            subjectSelect.innerHTML = '<option value="">ทุกรายวิชา</option>';
            
            // เรียงลำดับและเพิ่มตัวเลือก
            const sortedClassrooms = [...classrooms].sort((a, b) => a.name.localeCompare(b.name, 'th'));
            const sortedSubjects = [...subjects].sort((a, b) => a.name.localeCompare(b.name, 'th'));
            
            sortedClassrooms.forEach(classroom => {
                const option = document.createElement('option');
                option.value = classroom.id;
                option.textContent = classroom.name;
                classroomSelect.appendChild(option);
            });
            
            sortedSubjects.forEach(subject => {
                const option = document.createElement('option');
                option.value = subject.id;
                option.textContent = subject.name;
                subjectSelect.appendChild(option);
            });
        }

        // Attendance functions
        function loadAttendanceForm() {
            const date = document.getElementById('attendanceDate').value;
            const classroomId = document.getElementById('attendanceClassroom').value;
            const subjectId = document.getElementById('attendanceSubject').value;
            
            if (!date || !classroomId || !subjectId) {
                showMessage('กรุณาเลือกวันที่ ห้องเรียน และรายวิชา', 'error');
                return;
            }
            
            const classroom = classrooms.find(c => c.id == classroomId);
            if (!classroom || !classroom.students || classroom.students.length === 0) {
                showMessage('ไม่พบรายชื่อนักเรียนในห้องเรียนนี้', 'error');
                return;
            }
            
            currentStudents = classroom.students;
            renderStudentAttendance();
            document.getElementById('studentList').classList.remove('hidden');
        }

        function renderStudentAttendance() {
            const container = document.getElementById('studentAttendance');
            container.innerHTML = '';
            
            currentStudents.forEach(student => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-3 bg-gray-50 rounded-lg';
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="font-medium text-gray-800">${student.number}.</span>
                        <span class="text-gray-700">${student.name}</span>
                        <span class="text-sm text-gray-500">(${student.studentId})</span>
                    </div>
                    <div class="flex space-x-2">
                        <label class="flex items-center">
                            <input type="radio" name="attendance_${student.id}" value="present" class="mr-2" checked>
                            <span class="text-green-600">มา</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="attendance_${student.id}" value="absent" class="mr-2">
                            <span class="text-red-600">ขาด</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="attendance_${student.id}" value="late" class="mr-2">
                            <span class="text-yellow-600">สาย</span>
                        </label>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function saveAttendance() {
            const date = document.getElementById('attendanceDate').value;
            const classroomId = document.getElementById('attendanceClassroom').value;
            const subjectId = document.getElementById('attendanceSubject').value;
            
            const classroom = classrooms.find(c => c.id == classroomId);
            const subject = subjects.find(s => s.id == subjectId);
            
            if (!classroom || !subject) {
                showMessage('ไม่พบข้อมูลห้องเรียนหรือรายวิชา', 'error');
                return;
            }
            
            const attendance = [];
            currentStudents.forEach(student => {
                const statusElement = document.querySelector(`input[name="attendance_${student.id}"]:checked`);
                if (statusElement) {
                    attendance.push({
                        studentId: student.id,
                        studentNumber: student.number,
                        studentName: student.name,
                        studentIdNumber: student.studentId,
                        status: statusElement.value
                    });
                }
            });
            
            const attendanceRecord = {
                id: `${date}_${classroomId}_${subjectId}`,
                date: date,
                classroomId: classroomId,
                classroomName: classroom.name,
                subjectId: subjectId,
                subjectName: subject.name,
                attendance: attendance
            };
            
            try {
                showLoading('กำลังบันทึกข้อมูล...');
                
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'saveAttendance',
                        attendanceRecord: attendanceRecord,
                        sheetId: '1ski-KWzrzsnWKkdlbJ0sPdwtNWZR5No809eK-Bk91t4'
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Update local data
                    const existingIndex = attendanceRecords.findIndex(r => r.id === attendanceRecord.id);
                    if (existingIndex >= 0) {
                        attendanceRecords[existingIndex] = attendanceRecord;
                    } else {
                        attendanceRecords.push(attendanceRecord);
                    }

        function editStudentInline(studentId) {

            if (!student) return;
            
            const newNumber = prompt('แก้ไขเลขที่:', student.number);
            if (newNumber === null) return;
            
            const newStudentId = prompt('แก้ไขเลขประจำตัวนักเรียน:', student.studentId);
            if (newStudentId === null) return;
            
            const newName = prompt('แก้ไขชื่อ-สกุล:', student.name);
            if (newName === null) return;
            
            const numberInt = parseInt(newNumber);
            if (!numberInt || !newStudentId.trim() || !newName.trim()) {
                showMessage('กรุณากรอกข้อมูลให้ครบถ้วน', 'error');
                return;

            // ตรวจสอบเลขที่ซ้ำ (ยกเว้นตัวเอง)
            if (currentEditingClassroom.students.some(s => s.number === numberInt && s.id !== studentId)) {
                showMessage('เลขที่นี้มีอยู่แล้ว', 'error');
                return;

                showMessage('เลขประจำตัวนักเรียนนี้มีอยู่แล้ว', 'error');

            student.name = newName.trim();
            
            renderStudentList();

        // Excel Import Functions
        function importFromExcel() {
            const fileInput = document.getElementById('excelFile');
            const file = fileInput.files[0];
            
            if (!file) {
                showMessage('กรุณาเลือกไฟล์ Excel', 'error');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    
                    processExcelData(jsonData);
                } catch (error) {
                    console.error('Error reading Excel file:', error);
                    showMessage('เกิดข้อผิดพลาดในการอ่านไฟล์ Excel', 'error');
                }
            };
            
            reader.readAsArrayBuffer(file);
        }

        function processExcelData(data) {
            importedStudents = [];
            
            // ข้ามแถวแรกถ้าเป็น header
            const startRow = data[0] && (isNaN(data[0][0]) || data[0][0] === 'เลขที่') ? 1 : 0;
            
            for (let i = startRow; i < data.length; i++) {
                const row = data[i];
                if (row && row.length >= 3 && row[0] && row[1] && row[2]) {
                    const number = parseInt(row[0]);
                    const studentId = String(row[1]).trim();
                    const name = String(row[2]).trim();
                    
                    if (number && studentId && name) {
                        importedStudents.push({
                            id: Date.now() + i,
                            number: number,
                            studentId: studentId,
                            name: name
                        });
                    }
                }
            }
            
            if (importedStudents.length === 0) {
                showMessage('ไม่พบข้อมูลที่ถูกต้องในไฟล์ Excel', 'error');
                return;
            }
            
            displayImportPreview();
        }

        function displayImportPreview() {
            const previewDiv = document.getElementById('importPreview');
            const dataDiv = document.getElementById('importedData');
            
            let html = '<div class="space-y-1">';
            importedStudents.forEach(student => {
                html += `
                    <div class="flex items-center space-x-4 text-sm">
                        <span class="w-12">${student.number}.</span>
                        <span class="w-32">${student.studentId}</span>
                        <span>${student.name}</span>
                    </div>
                `;
            });
            html += '</div>';
            
            dataDiv.innerHTML = html;
            previewDiv.classList.remove('hidden');
            document.getElementById('saveImportBtn').classList.remove('hidden');
            document.getElementById('clearImportBtn').classList.remove('hidden');
            
            showMessage(`พบข้อมูล ${importedStudents.length} รายการ`, 'success');
        }

        function saveImportedStudents() {
            if (!currentEditingClassroom || importedStudents.length === 0) return;
            
            let addedCount = 0;
            let skippedCount = 0;
            
            importedStudents.forEach(importedStudent => {
                // ตรวจสอบเลขที่ซ้ำ
                const existingByNumber = currentEditingClassroom.students.find(s => s.number === importedStudent.number);
                // ตรวจสอบเลขประจำตัวซ้ำ
                const existingByStudentId = currentEditingClassroom.students.find(s => s.studentId === importedStudent.studentId);
                
                if (!existingByNumber && !existingByStudentId) {
                    currentEditingClassroom.students.push(importedStudent);
                    addedCount++;
                } else {
                    skippedCount++;
                }
            });
            
            renderStudentList();
            clearImportedData();
            
            if (addedCount > 0) {
                showMessage(`นำเข้าข้อมูลสำเร็จ ${addedCount} รายการ${skippedCount > 0 ? ` (ข้าม ${skippedCount} รายการที่ซ้ำ)` : ''}`, 'success');
            } else {
                showMessage('ไม่มีข้อมูลใหม่ที่สามารถนำเข้าได้ (ข้อมูลซ้ำทั้งหมด)', 'info');
            }
        }

        function clearImportedData() {
            importedStudents = [];
            document.getElementById('importPreview').classList.add('hidden');
            document.getElementById('saveImportBtn').classList.add('hidden');
            document.getElementById('clearImportBtn').classList.add('hidden');
            document.getElementById('excelFile').value = '';
        }

        // History functions
        function filterHistory() {
            const date = document.getElementById('historyDate').value;
            const classroomId = document.getElementById('historyClassroom').value;
            const subjectId = document.getElementById('historySubject').value;
            
            let filteredRecords = attendanceRecords;
            
            if (date) {
                filteredRecords = filteredRecords.filter(record => record.date === date);
            }
            
            if (classroomId) {
                filteredRecords = filteredRecords.filter(record => record.classroomId == classroomId);
            }
            
            if (subjectId) {
                filteredRecords = filteredRecords.filter(record => record.subjectId == subjectId);
            }
            
            renderHistoryResults(filteredRecords);
        }

        function renderHistoryResults(records) {
            const container = document.getElementById('historyResults');
            
            if (records.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8">ไม่พบข้อมูลการเข้าเรียน</p>';
                return;
            }
            
            let html = '<div class="space-y-4">';
            
            records.forEach(record => {
                const presentCount = record.attendance.filter(a => a.status === 'present').length;
                const absentCount = record.attendance.filter(a => a.status === 'absent').length;
                const lateCount = record.attendance.filter(a => a.status === 'late').length;
                
                html += `
                    <div class="border border-gray-200 rounded-lg p-4">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="font-semibold text-lg text-gray-800">${record.date}</h3>
                                <p class="text-gray-600">${record.classroomName} - ${record.subjectName}</p>
                            </div>
                            <div class="text-right">
                                <div class="text-sm text-gray-500">
                                    <span class="text-green-600">มา: ${presentCount}</span> |
                                    <span class="text-red-600">ขาด: ${absentCount}</span> |
                                    <span class="text-yellow-600">สาย: ${lateCount}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <h4 class="font-medium text-green-600 mb-2">มาเรียน (${presentCount})</h4>
                                <div class="text-sm text-gray-700">
                                    ${record.attendance.filter(a => a.status === 'present').map(a => `${a.studentNumber}. ${a.studentName}`).join('<br>')}
                                </div>
                            </div>
                            <div>
                                <h4 class="font-medium text-red-600 mb-2">ขาดเรียน (${absentCount})</h4>
                                <div class="text-sm text-gray-700">
                                    ${record.attendance.filter(a => a.status === 'absent').map(a => `${a.studentNumber}. ${a.studentName}`).join('<br>')}
                                </div>
                            </div>
                            <div>
                                <h4 class="font-medium text-yellow-600 mb-2">มาสาย (${lateCount})</h4>
                                <div class="text-sm text-gray-700">
                                    ${record.attendance.filter(a => a.status === 'late').map(a => `${a.studentNumber}. ${a.studentName}`).join('<br>')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        // ฟังก์ชันลบข้อมูลการเข้าเรียนที่เลือก
        async function deleteSelectedAttendance() {
            const date = document.getElementById('historyDate').value;
            const classroomId = document.getElementById('historyClassroom').value;
            const subjectId = document.getElementById('historySubject').value;
            
            if (!date || !classroomId || !subjectId) {
                showMessage('กรุณาเลือกวันที่ ห้องเรียน และรายวิชาที่ต้องการลบ', 'error');
                return;
            }
            
            const classroom = classrooms.find(c => c.id == classroomId);
            const subject = subjects.find(s => s.id == subjectId);
            
            if (!classroom || !subject) {
                showMessage('ไม่พบข้อมูลห้องเรียนหรือรายวิชา', 'error');
                return;
            }
            
            const confirmMessage = `คุณต้องการลบข้อมูลการเข้าเรียนหรือไม่?\n\nวันที่: ${date}\nห้องเรียน: ${classroom.name}\nรายวิชา: ${subject.name}\n\nการดำเนินการนี้ไม่สามารถยกเลิกได้`;
            
            if (confirm(confirmMessage)) {
                try {
                    showLoading('กำลังลบข้อมูล...');
                    
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            action: 'deleteAttendanceRecord',
                            date: date,
                            classroomId: classroomId,
                            subjectId: subjectId,
                            sheetId: '1ski-KWzrzsnWKkdlbJ0sPdwtNWZR5No809eK-Bk91t4'
                        })
                    });

                    const result = await response.json();
                    
                    if (result.success) {
                        // อัปเดตข้อมูลในหน้าเว็บ
                        attendanceRecords = attendanceRecords.filter(record => 
                            !(record.date === date && record.classroomId == classroomId && record.subjectId == subjectId)
                        );
                        
                        // รีเฟรชผลการค้นหา
                        filterHistory();
                        showMessage('ลบข้อมูลการเข้าเรียนสำเร็จ', 'success');
                    } else {
                        showMessage('เกิดข้อผิดพลาดในการลบข้อมูล: ' + (result.message || 'ไม่ทราบสาเหตุ'), 'error');
                    }
                } catch (error) {
                    console.error('Error deleting attendance record:', error);
                    showMessage('เกิดข้อผิดพลาดในการลบข้อมูล: ' + error.message, 'error');
                } finally {
                    hideLoading();
                }
            }
        }
    </script>
